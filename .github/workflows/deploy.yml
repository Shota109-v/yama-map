# main ブランチに push したとき、または毎朝、主要な山のおすすめ度を計算して GitHub Pages に公開する
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 毎日 4:00（日本時間）。UTC で指定する
    - cron: '0 19 * * *'
  workflow_dispatch:

# 既定では何も許可せず、ジョブごとに必要な権限だけを与える
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

# 外部のアクションは、タグの付け替えで中身が変わらないようコミットで固定する（右のコメントが元のタグ）
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # ビルド中のスクリプトから git の認証情報を使えないようにする
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      # package-lock.json どおりに入れる。インストール時のスクリプトは実行しない
      - run: npm ci --ignore-scripts
      # 主要な山のおすすめ度を計算する（約15分、Open-Meteo の1日の無料枠の半分ほどを使う）。
      # 毎朝の定期実行と手動実行のときだけ計算し、push のときは公開中のものを使い回す
      - name: Build recommendations
        if: github.event_name != 'push'
        run: npx tsx scripts/build-recommendations.ts
        continue-on-error: true
        timeout-minutes: 30
      - name: Reuse published recommendations
        if: github.event_name == 'push'
        run: curl -fsSL -o public/data/recommendations.json "https://shota109-v.github.io/yama-map/data/recommendations.json" || echo "公開中のおすすめデータがありません"
      # 失敗したときに壊れたファイルを公開しないようにする
      - name: Drop empty recommendations
        run: '[ -s public/data/recommendations.json ] || rm -f public/data/recommendations.json'
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
