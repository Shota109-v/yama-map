# main ブランチに push したとき、または毎朝、主要な山のおすすめ度を計算して GitHub Pages に公開する
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 毎日 2:00（日本時間）。UTC で指定する。
    # GitHub の定期実行は混雑すると1〜2時間遅れることがあるので、朝までに終わるよう早めにしている
    - cron: '0 17 * * *'
  workflow_dispatch:

# 既定では何も許可せず、ジョブごとに必要な権限だけを与える
permissions: {}

concurrency:
  group: pages
  # 長い計算の途中で次の実行に打ち切られないよう、前の実行が終わるのを待つ
  cancel-in-progress: false

# 外部のアクションは、タグの付け替えで中身が変わらないようコミットで固定する（右のコメントが元のタグ）
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # ビルド中のスクリプトから git の認証情報を使えないようにする
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # package-lock.json どおりに入れる。インストール時のスクリプトは実行しない
      - run: npm ci --ignore-scripts
      # push のときは、公開中のおすすめデータを使い回す（Open-Meteo の無料枠を節約するため）
      - name: Reuse published recommendations
        id: reuse
        if: github.event_name == 'push'
        run: |
          if curl -fsSL -o public/data/recommendations.json "https://shota109-v.github.io/yama-map/data/recommendations.json"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "公開中のおすすめデータがないので、計算する"
            rm -f public/data/recommendations.json
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      # 主要な山のおすすめ度を計算する（15〜40分、Open-Meteo の1日の無料枠の半分ほどを使う）。
      # 毎朝の定期実行・手動実行と、公開中のデータがない push のときに計算する。
      # 時間切れや混雑で途中までになっても、計算できた山の分は公開する
      - name: Build recommendations
        if: github.event_name != 'push' || steps.reuse.outputs.found != 'true'
        run: npx tsx scripts/build-recommendations.ts
        continue-on-error: true
        timeout-minutes: 85
        env:
          RECOMMENDATIONS_BUDGET_MIN: '75'
      # 失敗したときに壊れたファイルを公開しないようにする
      - name: Drop empty recommendations
        run: |
          rm -f public/data/recommendations.json.tmp
          [ -s public/data/recommendations.json ] || rm -f public/data/recommendations.json
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
